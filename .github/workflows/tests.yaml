name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install --upgrade pytest ruff
      - name: Lint
        run: ruff check custom_components tests
      - name: Test provider-neutral core
        run: pytest -q
